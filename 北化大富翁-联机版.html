<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北化大富翁 · 昌平校区版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C2402E'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23F6EFE0' stroke-width='5'/%3E%3Ccircle cx='22' cy='24' r='4' fill='%23F6EFE0'/%3E%3Ccircle cx='40' cy='38' r='4' fill='%23F6EFE0'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F6EFE0; --paper2:#EFE4CC; --card:#FFFDF6; --ink:#2A2A35; --muted:#8A8270;
  --line:#E3D7BC; --shadow:0 6px 18px rgba(90,60,20,.14);
  --c-teach:#C2402E; --c-life:#E09A2E; --c-sport:#3E7C4F; --c-serv:#3A6EA8;
  --c-quiz:#7B5EA7; --c-event:#8A5A3B; --c-special:#5A6470; --c-start:#B98A1F;
  --p1:#E74C3C; --p2:#2F7BD8; --p3:#27A05F; --p4:#E0961B;
  --accent:#C2402E; --ok:#2E8B57; --bad:#C0392B; --gold:#E0A22E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(224,154,46,.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(62,124,79,.14), transparent 55%),
    var(--paper);
  color:var(--ink);font-size:16px;line-height:1.5;
  min-height:100dvh;display:flex;flex-direction:column;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid rgba(194,64,46,.5);outline-offset:2px}
.icon{width:1em;height:1em;fill:currentColor;flex:none}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  position:sticky;top:0;z-index:30;background:rgba(246,239,224,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.5px;min-width:0;flex:1}
.brand .badge{background:var(--accent);color:#FFF6EC;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:1px;flex:none}
.topbtn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);flex:none}
.topbtn:hover{background:var(--paper2)}
.topbtn .icon{width:16px;height:16px}

/* ===== 视图 ===== */
.view{display:none;flex:1;flex-direction:column;padding:10px 10px 12px;max-width:1080px;margin:0 auto;width:100%}
.view.active{display:flex}

/* ===== 棋盘区（环形 + 中央地图） ===== */
.stage{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.board-wrap{position:relative;width:100%;margin:0 auto}
.board{
  display:grid;grid-template-columns:repeat(12,1fr);gap:2px;aspect-ratio:1/1;
  background:var(--paper2);padding:4px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);
}
.cell{
  position:relative;background:rgba(255,253,246,.93);border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:1px solid rgba(227,215,188,.8);min-width:0;z-index:1;
}
.cell .cbar{position:absolute;top:0;left:0;right:0;height:5px}
.cell .cicon{width:16px;height:16px;margin-top:5px;color:var(--ink)}
.cell .cname{font-size:8px;font-weight:700;line-height:1.15;text-align:center;padding:0 1px;width:100%;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .csub{font-size:7px;color:var(--muted);line-height:1.1;text-align:center;padding:0 1px 3px;width:100%;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell.current{box-shadow:0 0 0 3px var(--accent);z-index:2}
.map-center{
  grid-row:1 / 13;grid-column:1 / 13;position:relative;border-radius:12px;overflow:hidden;
  border:3px solid var(--card);box-shadow:inset 0 0 0 2px var(--line),var(--shadow);min-height:0;
  z-index:0;
}
.map-center img{width:100%;height:100%;object-fit:cover;display:block}
.map-center svg{width:100%;height:100%;display:block}
.map-center .map-tag{
  position:absolute;left:8px;top:8px;background:rgba(42,42,53,.72);color:#FFF6EC;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:1px;
  display:flex;align-items:center;gap:6px;backdrop-filter:blur(2px);
}
.map-center .map-round{
  position:absolute;right:8px;bottom:8px;background:rgba(255,253,246,.9);color:var(--ink);
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
}
/* 棋子 */
.pieces{position:absolute;inset:6px;pointer-events:none;z-index:5}
.piece{
  position:absolute;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:800;
  border:2px solid #fff;box-shadow:0 3px 7px rgba(0,0,0,.3);
  transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),transform .4s ease;
  will-change:transform;z-index:6;
}
.piece.hop{animation:hop .5s ease}
@keyframes hop{0%{transform:scale(1)}32%{transform:scale(1.3)}58%{transform:scale(.9)}78%{transform:scale(1.08)}100%{transform:scale(1)}}
.piece .icon{width:14px;height:14px}
.piece[data-p="1"]{background:var(--p1)} .piece[data-p="2"]{background:var(--p2)}
.piece[data-p="3"]{background:var(--p3)} .piece[data-p="4"]{background:var(--p4)}
.piece.focus{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.35)}
.piece.debuff{outline:3px dashed var(--bad);outline-offset:2px}
/* 地产标记 */
.pmark{position:absolute;left:3px;bottom:3px;display:flex;align-items:center;gap:2px;z-index:3}
.pmark .dot{width:7px;height:7px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.pmark .lv{font-size:8px;font-weight:800;background:rgba(255,255,255,.92);border-radius:4px;padding:0 3px;line-height:12px;color:var(--ink);border:1px solid var(--line)}

/* ===== 玩家条 ===== */
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.pcard.active{border-color:var(--accent);box-shadow:var(--shadow)}
.pcard .pname{font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px;min-width:0;padding-right:54px}
.pcard .pname .chip{width:12px;height:12px;border-radius:50%;flex:none}
.pcard .pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pstats{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.pcard .stat{display:flex;align-items:center;gap:5px;color:var(--muted)}
.pcard .stat .icon{width:12px;height:12px;flex:none}
.pcard .stat b{color:var(--ink);font-size:12.5px;font-weight:800;min-width:34px}
.pcard .stat em{font-style:normal;font-size:9.5px;color:var(--muted);margin-left:auto;opacity:.8}
.pcard .pgpa{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;color:var(--c-quiz)}
.pcard .pbars{margin-top:2px;display:flex;flex-direction:column;gap:3px}
.pcard .pbar-row{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted);font-weight:600}
.pcard .pbar-row .pbar{flex:1}
.pcard .pbar{height:5px;border-radius:3px;background:#EFE6D2;overflow:hidden;display:flex}
.pcard .pbar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.pcard .pbar.energy i{background:var(--ok)}
.pcard .pbar.mood i{background:var(--gold)}
.pcard .pbar.gpa i{background:var(--c-quiz)}
.pcard .pitems{font-size:10px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;min-height:13px}
.pcard .pitems b{color:var(--ink)}
.pcard .warn{border-color:var(--gold);background:#FFF9E8}
.pcard .blocked{border-color:var(--bad);background:#FDEBEA}
.pcard.dead{opacity:.45}
.pcard.dead .pname{text-decoration:line-through}

/* ===== 行动区 ===== */
.action{display:flex;align-items:center;gap:10px;margin-top:4px}
.actinfo{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.4}
.actinfo .dim{display:block;font-size:11px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:800;color:#FFF6EC;background:var(--accent);padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);flex:none;min-width:120px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn.sm{font-size:13px;padding:8px 14px;border-radius:10px;min-width:0}
.btn .icon{width:19px;height:19px}
.dice{width:52px;height:52px;border-radius:13px;background:#fff;border:2px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px;flex:none;box-shadow:var(--shadow);position:relative}
.dice i{background:#2A2A35;border-radius:3px;opacity:0;transition:opacity .08s}
.dice.rolling{animation:shake .55s ease}
.dice.land{animation:land .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-24deg) scale(1.14) translateY(-4px)}30%{transform:rotate(19deg) scale(.9)}50%{transform:rotate(-14deg) scale(1.08) translateY(-3px)}70%{transform:rotate(9deg) scale(.94)}88%{transform:rotate(-5deg) scale(1.03)}}
@keyframes land{0%{transform:scale(1.25)}55%{transform:scale(.92)}100%{transform:scale(1)}}

/* 大骰子弹窗 */
.dice-big-box{display:flex;justify-content:center;gap:14px;padding:10px 0 4px}
.dice-big{width:104px;height:104px;border-radius:24px;padding:18px;gap:5px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.dice-big i{border-radius:8px}
.dice-big.rolling{animation:shakeBig .6s ease}
@keyframes shakeBig{0%,100%{transform:rotate(0) scale(1)}12%{transform:rotate(-32deg) scale(1.18) translateY(-16px)}30%{transform:rotate(26deg) scale(.9) translateY(8px)}48%{transform:rotate(-20deg) scale(1.12) translateY(-11px)}66%{transform:rotate(13deg) scale(.94)}84%{transform:rotate(-8deg) scale(1.06)}}
.dice-result{text-align:center;font-size:24px;font-weight:900;margin-top:12px;min-height:30px}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(42,30,10,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:20px;max-width:430px;width:100%;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.3,1.4,.6,1);max-height:88dvh;overflow:auto}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mtitle{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.mclose{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper2);color:var(--muted);flex:none}
.mclose .icon{width:16px;height:16px}
.mbody{font-size:14px;color:var(--ink)}
.mbody .row{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.mbody .row:last-child{border-bottom:none}
.mbody .row b{font-weight:800}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mdesc{font-size:13.5px;line-height:1.65;color:#3D3A33;margin-bottom:12px}

/* 答题 */
.qcard{background:var(--paper2);border-radius:14px;padding:14px;margin-bottom:12px;font-weight:700;font-size:15px;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 13px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px;transition:border-color .15s}
.opt .key{width:22px;height:22px;border-radius:7px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:#EAF5EE}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FBECEA}
.opt.wrong .key{background:var(--bad);color:#fff}

/* 事件卡 */
.event-card{background:linear-gradient(150deg,#8A5A3B,#6E4529);color:#FFF3E6;border-radius:16px;padding:18px 16px;text-align:center;box-shadow:var(--shadow)}
.event-card .eicon{width:44px;height:44px;margin:0 auto 10px;color:#FFD9A0}
.event-card .etitle{font-size:17px;font-weight:800;margin-bottom:4px}
.event-card .edesc{font-size:13px;line-height:1.6;opacity:.92}
.event-card .eeff{margin-top:10px;display:inline-block;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800}

/* 转盘 */
.wheel-box{text-align:center}
.wheel-wrap{position:relative;width:230px;height:230px;margin:4px auto 14px}
.wheel-disc{width:100%;height:100%;transition:transform 2.4s cubic-bezier(.15,.9,.25,1);will-change:transform}
.wheel-pin{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--accent);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:3;box-shadow:var(--shadow)}
.wheel-result{font-size:18px;font-weight:800;min-height:28px;margin-bottom:6px}
.wheel-result.good{color:var(--ok)} .wheel-result.bad{color:var(--bad)} .wheel-result.flat{color:var(--muted)}

/* 结算 */
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:#fff;border:1.5px solid var(--line)}
.rank-item.win{background:#FFF6E0;border-color:#E0B13F;box-shadow:0 4px 14px rgba(224,154,46,.25)}
.rank-item .rno{width:26px;height:26px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.rank-item.win .rno{background:linear-gradient(135deg,#F2C14E,#E0A22E);color:#fff}
.rank-item .rname{font-weight:800;font-size:14px;flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.rank-item .rname .chip{width:11px;height:11px;border-radius:50%;flex:none}
.rank-item .rval{font-size:13px;color:var(--muted);font-weight:600;text-align:right}
.rank-item .rval b{color:var(--ink);font-size:14px;display:block}
.rank-item .rassets{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}

/* ===== 设置页 ===== */
.setup-card{background:var(--card);border-radius:22px;padding:24px 20px;margin:auto 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.setup-hero{text-align:center;margin-bottom:20px}
.setup-hero .sh-logo{width:74px;height:74px;margin:0 auto 10px;color:var(--accent)}
.setup-hero h1{font-size:24px;font-weight:900;letter-spacing:1px}
.setup-hero p{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:2px}
.sec{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:16px 0 8px}
.pcount{display:flex;gap:8px}
.pcount button{flex:1;padding:10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:15px}
.pcount button.on{background:var(--accent);color:#FFF6EC;border-color:var(--accent)}
.pname-grid{display:flex;flex-direction:column;gap:8px}
.pname-row{display:flex;align-items:center;gap:9px}
.pname-row .chip{width:16px;height:16px;border-radius:50%;flex:none}
.pname-row input{flex:1;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:600;font-family:inherit;color:var(--ink);min-width:0}
.pname-row input:focus{outline:none;border-color:var(--accent)}
.setup-foot{margin-top:18px;display:flex;gap:10px}
.setup-foot .btn{flex:1}

/* ===== 帮助页 ===== */
.help-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.help-card h2{font-size:17px;font-weight:800;margin:16px 0 8px}
.help-card h2:first-child{margin-top:0}
.help-card p,.help-card li{font-size:13.5px;line-height:1.75;color:#3D3A33}
.help-card ul{padding-left:18px;margin:4px 0}
.help-card .tile{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13.5px}
.help-card .swatch{width:14px;height:14px;border-radius:4px;flex:none}
.help-card .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
.help-card .kv .row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:13px}
.help-card .kv .row b{font-weight:800}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.legend .li{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.legend .sw{width:13px;height:13px;border-radius:4px;flex:none}

/* ===== toast ===== */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 通用 */
.hidden{display:none!important}
.small{font-size:12px;color:var(--muted)}
.center{text-align:center}
.mt8{margin-top:8px}
.tag{display:inline-block;background:var(--paper2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.eff-line{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--paper2);font-size:13px;font-weight:600;line-height:1.6}
.eff-line.good{background:#EAF5EE} .eff-line.bad{background:#FBECEA}

/* ===== 桌面扩展 ===== */
@media (min-width:768px){
  .view{padding:14px 20px 18px}
  .stage{flex-direction:row;align-items:flex-start;gap:18px}
  .board-wrap{flex:1;max-width:780px}
  .side{width:330px;flex:none;display:flex;flex-direction:column;gap:12px}
  .cell .cicon{width:19px;height:19px}
  .cell .cname{font-size:10px}
  .cell .csub{font-size:9px}
  .cell .cbar{height:6px}
  .piece{width:26px;height:26px;font-size:13px}
  .players{order:2}
  .action{margin-top:0}
  #players-m,#action-m{display:none!important}
}
.side .helpbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:12.5px;line-height:1.7;color:#3D3A33}
.side .helpbox b{color:var(--ink)}
@media (max-width:767px){
  .side{display:none}
}
/* ===== 迷你小游戏 ===== */
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini-card{border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;background:var(--card);transition:transform .15s}
.mini-card:active{transform:scale(.96)}
.mini-card b{display:block;font-size:14px;margin-bottom:6px}

    {t:"黑天鹅女士", d:"黑天鹅女士优雅划过湖面，湖面泛起涟漪。", feed:{m:-12,e:15,mo:12}, watch:{mo:10,e:5}},
    {t:"鸭群", d:"一群鸭子在岸边排排队，摇摇摆摆。", feed:{m:-8,e:12,mo:8}, watch:{mo:8}},
    {t:"吹笛子的人", d:"湖边有人吹笛子，旋律悠扬，你驻足听了会儿。", auto:{mo:15,e:8}},

    {t:"喜欢的东西到了", d:"期待很久的快递终于到了！拆箱瞬间幸福感爆棚。", eff:{m:-50,mo:20}},
    {t:"帮同学代取", d:"顺手帮同学代取快递，赚了跑腿费。", eff:{m:20,mo:5}},
    {t:"包裹破损", d:"包裹被压变形，申请了理赔。", eff:{m:30,mo:-5}},
    {t:"排队太久", d:"取件队伍太长，等得有点烦躁。", eff:{mo:-8}}
  ],
  activity: [
    {t:"心理咨询", d:"和心理老师聊了聊，轻松了很多。", eff:{mo:20}},
    {t:"社团活动", d:"参加社团团建，认识了一群新朋友。", eff:{mo:15}},
    {t:"课外游戏", d:"桌游局开起来，一玩就是一下午。", eff:{mo:12,e:5}},
    {t:"行业讲座", d:"听了一场干货满满的讲座，视野打开。", eff:{g:0.02}}
  ]
};

/* ================= 道具 ================= */
const ITEMS = [
  {id:"hammer", name:"锤子", icon:"i-wrench", desc:"答题时可免答一次"},
  {id:"goggles", name:"防护镜", icon:"i-splash", desc:"自动免疫一次负面状态"},
  {id:"trinket", name:"亚克力小挂件", icon:"i-star2", desc:"获得时心情 +10%"},
  {id:"laser", name:"激光切割片", icon:"i-bolt", desc:"获得时 +20~50 生活费"},

];

/* ================= 规则 ================= */
const RULES = {
  startMoney:1200, startGpa:3.0, startEnergy:100, startMood:100,
  gpaMax:4.33, gpaWarn:2.0, gpaBlock:1.0,
  rollCost:3, moodLow:20,         // 心情≤20 时掷骰体力消耗翻倍
  passStartMoney:200,             // 经过起点生活费（无绩点加成）
  craftCost:15,                   // 道具工坊体力消耗
  quizWin:0.05, quizLose:-0.03,   // 普通问答
  examWin:0.1, examLose:-0.05,    // 考试周
  failStreakNeed:2,               // 连续答错触发 debuff

<script>
"use strict";
/* ================= 工具 ================= */
const $=(s,el)=> (el||document).querySelector(s);
const $$=(s,el)=> [...(el||document).querySelectorAll(s)];
const rnd=(a,b)=> Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=> arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=> Math.max(a,Math.min(b,v));
const fmt=n=> (n<0?"-":"").concat(Math.abs(Math.round(n)));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const SFX={on:true,cur:null};
function beep(f=520,d=90,type="square"){if(!SFX.on)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!SFX.cur||SFX.cur.state==="suspended"){SFX.cur=new C();}const c=SFX.cur;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d/1000);o.start();o.stop(c.currentTime+d/1000);}catch(e){}}
const sfxRoll=()=>beep(320,60,"square");
const sfxWin=()=>{beep(660,110);setTimeout(()=>beep(880,140),110);};
const sfxBad=()=>{beep(220,150,"sawtooth");};
const sfxClick=()=>beep(520,50,"triangle");

/* ================= 状态 ================= */
let P=[],round=1,cur=0,rolling=false,selProp="",timer=null,toastTimer=null;
const viewStack=["view-setup"];

function showView(id){
  if(!viewStack.includes(id))viewStack.push(id);
  $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
}
function goBack(){if(viewStack.length>1){viewStack.pop();showView(viewStack[viewStack.length-1]);}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600);}

/* ================= 弹窗 ================= */
function openModal(html){
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal">${html}</div>`;
  root.classList.add("show");
}
function closeModal(){const root=$("#modal-root");root.classList.remove("show");root.innerHTML="";clearTimeout(timer);timer=null;if(window.cleanupMini){try{window.cleanupMini();}catch(e){}}}
function modalHead(title,icon){
  return `<div class="mhead"><div class="mtitle">${icon?'<svg class="icon" style="width:22px;height:22px" viewBox="0 0 24 24"><use href="#'+icon+'" xlink:href="#'+icon+'"/></svg>':""}${title}</div><button class="mclose" onclick="closeModal()"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close" xlink:href="#i-close"/></svg></button></div>`;
}
function effLine(eff){
  if(!eff)return "";
  const parts=[];
  if(eff.m)parts.push(`${eff.m>0?"+":""}${fmt(eff.m)} 生活费`);
  if(eff.g)parts.push(`${eff.g>0?"+":""}${eff.g} 绩点`);
  if(eff.e)parts.push(`${eff.e>0?"+":""}${eff.e} 体力`);
  if(eff.mo)parts.push(`${eff.mo>0?"+":""}${fmt(eff.mo)}% 心情`);
  return parts.join(" · ");
}
function applyEff(p,eff){
  if(!eff)return;
  if(eff.m)p.cash=clamp(p.cash+(eff.m||0),0,999999);
  if(eff.g)p.gpa=clamp(p.gpa+(eff.g||0),0,RULES.gpaMax);
  if(eff.e)p.energy=clamp(p.energy+(eff.e||0),0,100);
  if(eff.mo)p.mood=clamp(p.mood+(eff.mo||0),0,100);
}

/* ================= 设置页 ================= */
const PCOLORS=["#E74C3C","#2F7BD8","#27A05F","#E0961B"];
function setPcount(btn){
  $$("#pcount button").forEach(b=>b.classList.toggle("on",b===btn));
  renderPnames();
}
function renderPnames(){
  const n=+($("#pcount button.on").dataset.n||3);
  const grid=$("#pnames");grid.innerHTML="";
  for(let i=0;i<n;i++){
    const row=document.createElement("div");row.className="pname-row";
    row.innerHTML=`<span class="chip" style="background:${PCOLORS[i%4]}"></span>
      <input id="pn-${i}" maxlength="6" placeholder="玩家${i+1}" value="玩家${i+1}">`;
    grid.appendChild(row);
  }
}
function newGame(){
  if(NET.mode==="host"){startNetGame();return;}
  const n=+($("#pcount button.on").dataset.n||3);
  P=[];round=1;cur=0;rolling=false;selProp="";
  for(let i=0;i<n;i++){
    const inp=$("#pn-"+i);const name=(inp&&inp.value.trim())||("玩家"+(i+1));
    P.push({name,color:PCOLORS[i%4],cash:RULES.startMoney,gpa:RULES.startGpa,
      energy:RULES.startEnergy,mood:RULES.startMood,pos:0,items:{hammer:0,goggles:0},
      debuff:null,failStreak:0,alive:true,skip:0,props:{},dbl:0,bailout:0,xp:0});
  }
  renderAll();
  showView("view-game");
  const c=curP();
  openModal(modalHead("游戏开始","i-crown")+`<div class="mdesc">欢迎来到<b>北化大富翁 · 昌平校区版</b>！<br>你们从<b>南校门</b>出发，绕校园一圈。<br><br>第一位行动的是 <b>${c.name}</b>。目标：40 轮后按<b>总评分</b>决出校园传奇！</div>
  <div class="eff-line">掷骰子耗 5 体力 · 经过南校门领 300 生活费 · 绩点上限 4.33</div>
  <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAction()">开始掷骰</button></div>`);
}
function curP(){return P[cur];}

/* ================= 棋盘渲染 ================= */
function renderBoard(){
  const b=$("#board");
  if(b.dataset.ready)return;b.dataset.ready="1";
  BOARD.forEach(cell=>{
    const p=CELL_POS[cell.id];
    const cm=CAT_META[cell.cat];
    const el=document.createElement("div");
    el.className="cell";el.id="cell-"+cell.id;
    el.style.gridRow=(p.r+1)+" / "+(p.r+2);
    el.style.gridColumn=(p.c+1)+" / "+(p.c+2);
    el.innerHTML=`<div class="cbar" style="background:${cm.color}"></div>
      <svg class="icon cicon" viewBox="0 0 24 24"><use href="#${cell.icon}" xlink:href="#${cell.icon}"/></svg>
      <div class="cname">${cell.name}</div><div class="csub">${cell.sub}</div>
      <div class="pmark" id="pmark-${cell.id}"></div>`;
    b.appendChild(el);
  });
}
function refreshCells(){
  $$(".cell").forEach(el=>el.classList.remove("current"));
  P.forEach(p=>{if(p.alive){const el=$("#cell-"+p.pos);if(el)el.classList.add("current");}});
  renderPropMarks();
  const mr=$("#map-round");if(mr)mr.textContent="第 "+round+" / "+RULES.maxRounds+" 轮 · "+weatherNow();
}
function renderPropMarks(){
  const marks={};
  P.forEach((p,i)=>{for(const id in (p.props||{})){marks[id]={c:p.color,lv:p.props[id],n:p.name};}});
  for(const id in marks){
    const el=$("#pmark-"+id);if(!el)continue;
    const m=marks[id];
    el.innerHTML=`<span class="dot" style="background:${m.c}" title="${m.n}"></span><span class="lv">${m.lv}级</span>`;
  }
  BOARD.forEach(c=>{if(c.grp&&!marks[c.id]){const el=$("#pmark-"+c.id);if(el)el.innerHTML="";}});
}
function renderPieces(){
  const box=$("#pieces");box.innerHTML="";
  P.forEach((p,i)=>{
    if(!p.alive)return;
    const pos=CELL_POS[p.pos];
    const u=100/12;
    const el=document.createElement("div");
    el.className="piece";el.dataset.p=(i+1);el.id="piece-"+i;
    el.style.left=(pos.c*u+u/2)+"%";el.style.top=(pos.r*u+u/2)+"%";
    if(i===cur)el.classList.add("focus");
    if(p.debuff)el.classList.add("debuff");
    el.title=p.name;
    el.innerHTML=`<svg class="icon" viewBox="0 0 24 24"><use href="#i-dice" xlink:href="#i-dice"/></svg>`;
    box.appendChild(el);
  });
}
function renderPlayers(){
  [["#players",false],["#players-m",true]].forEach(([sel])=>{
    const box=$(sel);if(!box)return;
    box.innerHTML=P.map((p,i)=>{
      if(!p.alive){
        return `<div class="pcard dead"><div class="pname"><span class="chip" style="background:${p.color}"></span><span>${p.name}</span></div><div class="pstats">已出局</div></div>`;
      }
      const cls=["pcard",i===cur?"active":"",p.gpa<RULES.gpaWarn&&p.gpa>=RULES.gpaBlock?"warn":"",p.gpa<RULES.gpaBlock||p.mood<=0||p.energy<5?"blocked":""].join(" ");
      const items=[];if(p.items.hammer>0)items.push(`<span>锤×${p.items.hammer}</span>`);
      if(p.items.goggles>0)items.push(`<span>镜×${p.items.goggles}</span>`);
      if(p.items.water>0)items.push(`<span style="cursor:pointer;color:var(--accent)" onclick="useItem('water')" title="水枪：对任意玩家 -10 体力">水×${p.items.water}</span>`);
      if(p.items.coffee>0)items.push(`<span style="cursor:pointer;color:var(--good)" onclick="useItem('coffee')" title="咖啡券：给任意玩家 +10 体力">咖×${p.items.coffee}</span>`);
      const db=p.debuff?"<b style='color:var(--bad)'>挫</b>":"";
      const mi='<svg class="icon" style="width:11px;height:11px" viewBox="0 0 24 24"><use href="#i-money" xlink:href="#i-money"/></svg>';
      const di='<svg class="icon" style="width:11px;height:11px" viewBox="0 0 24 24"><use href="#i-dorm" xlink:href="#i-dorm"/></svg>';
      const propN=Object.keys(p.props||{}).length;
      const bi='<svg class="icon" style="width:11px;height:11px" viewBox="0 0 24 24"><use href="#i-bolt" xlink:href="#i-bolt"/></svg>';
      const hi='<svg class="icon" style="width:11px;height:11px" viewBox="0 0 24 24"><use href="#i-star2" xlink:href="#i-star2"/></svg>';
      return `<div class="${cls}" id="pcard-${i}">
        <div class="pname"><span class="chip" style="background:${p.color}"></span><span>${p.name}</span>${db}</div>
        <div class="pgpa">GPA ${p.gpa.toFixed(2)}</div>
        <div class="pstudy">学识 <b>${xpLevel(p.xp||0).lvl}</b></div>
        <div class="pstats">
          <div class="stat">${mi}<b>${p.cash}</b><em>生活费</em></div>
          <div class="stat">${bi}<b>${p.energy}</b><em>体力</em></div>
          <div class="stat">${hi}<b>${p.mood}%</b><em>心情</em></div>
          <div class="stat">${di}<b>${propN}</b><em>地产</em></div>
        </div>
        <div class="pbars">
          <div class="pbar-row"><span>体力</span><div class="pbar energy"><i style="width:${p.energy}%"></i></div></div>
          <div class="pbar-row"><span>心情</span><div class="pbar mood"><i style="width:${p.mood}%"></i></div></div>
        </div>
        <div class="pitems">${items.join("")||""}</div>
      </div>`;
    }).join("");
  });
}
function renderAction(){
  const p=curP();if(!p){return;}
  const myTurn=NET.mode!=="client"||NET.myIdx===cur;
  const wait=NET.mode==="client"&&!myTurn?` <span class="dim">（轮到 ${p.name} 操作）</span>`:"";
  const mk=(t)=>{
    const info=$("#action");const infoM=$("#action-m");
    if(info)info.innerHTML=t;if(infoM)infoM.innerHTML=t;
  };
  if(!p.alive){
    mk(`<div class="actinfo"><b>${p.name}</b> 已出局，等待下一位同学…</div>`);
    return;
  }
  if(p.gpa<RULES.gpaBlock){
    mk(`<div class="actinfo"><b>${p.name}</b><span class="dim">绩点低于 ${RULES.gpaBlock}，被学业预警，本回合强制自习</span></div>
      <button class="btn bad" onclick="studySkip()" ${myTurn?"":"disabled"}>强制自习</button>`);
    return;
  }
  if(p.mood<=0){
    mk(`<div class="actinfo"><b>${p.name}</b><span class="dim">心情跌落谷底，本回合休息调整（+20% 心情）</span></div>
      <button class="btn ok" onclick="moodRest()" ${myTurn?"":"disabled"}>休息调整</button>`);
    return;
  }
  if(p.energy<5){
    mk(`<div class="actinfo"><b>${p.name}</b><span class="dim">体力不足，本回合休息（+30 体力）</span></div>
      <button class="btn ok" onclick="restTurn()" ${myTurn?"":"disabled"}>休息</button>`);
    return;
  }
  const rollCost=RULES.rollCost*(p.mood<=RULES.moodLow?2:1);
  mk(`<div class="actinfo"><b>${p.name}</b> 行动<span class="dim">掷骰消耗 ${rollCost} 体力 · 已进行 ${round-1} / ${RULES.maxRounds} 轮</span>${wait}</div>
    <div style="display:flex;gap:6px"><div class="dice" id="dice-anim"></div><div class="dice" id="dice-anim2"></div></div>
    <button class="btn" id="btn-roll" onclick="doRoll()" ${myTurn?"":"disabled"}><svg class="icon" viewBox="0 0 24 24"><use href="#i-dice" xlink:href="#i-dice"/></svg>掷骰子</button>`);
  setDice(1);
}
function renderHint(){
  const p=curP();if(!p)return;
  const box=$("#side-hint");if(!box)return;
  const gpaNote=p.gpa<RULES.gpaBlock?"<b style='color:var(--bad)'>绩点过低，强制自习！</b>":
    p.gpa<RULES.gpaWarn?"<b style='color:var(--gold)'>绩点警告：加油学习！</b>":"";
  box.innerHTML=`<b>${p.name}</b> 的本回合提示<br>${gpaNote||"平稳发挥，掷骰前进"}`;
}
function renderAll(){renderBoard();refreshCells();renderPieces();renderPlayers();renderAction();renderHint();}

/* ================= 骰子 ================= */
function setDice(n,idx){
  const dots=[[],[1],[0,2],[0,1,2],[0,2,4,6],[0,2,4,6,8],[0,2,3,4,5,6,8]];
  $$(".dice").forEach((d,i)=>{
    if(idx!==undefined&&i%2!==idx)return;
    d.innerHTML="";
    for(let k=0;k<9;k++){const p=document.createElement("i");if((dots[n]||[]).includes(k))p.style.opacity=1;d.appendChild(p);}
  });
}
</script>
<script>
"use strict";
/* ================= 学习类限制 ================= */
const MOOD_STUDY=30;
function studyOK(p){return p.mood>=MOOD_STUDY;}
const NO_STUDY_MSG="心情低于 30%，静不下心学习，本次只能离开。";

/* ================= 回合 ================= */
function doRoll(){
  if(rolling)return;
  const p=curP();
  rolling=true;
  sfxRoll();
  const cost=RULES.rollCost*(p.mood<=RULES.moodLow?2:1);
  let d1=rnd(1,6), d2=rnd(1,6);
  let d=d1+d2, note="";
  if(p.debuff==="confidence"){
    d=Math.ceil(d/2);
    note=`<div class="eff-line bad">自信心受挫：骰子点数减半，掷出 ${d}</div>`;
    p.debuff=null;
  }
  p.dbl=(d1===d2)?1:0;
  p.energy=clamp(p.energy-cost,0,100);
  const old=p.pos;
  const np=(old+d)%BOARD.length;
  let passMsg="";
  if(np<old){p.cash+=RULES.passStartMoney;passMsg=`<div class="eff-line good">经过南校门：生活费 +${RULES.passStartMoney}</div>`;}
  p.pos=np;
  if(NET.isHost)NET.broadcast({t:"roll",d1:d1,d2:d2,d:d,note:note,passMsg:passMsg});
  rollUI(d1,d2,d,note,passMsg);
}
let rollResult=null;
function confirmMove(){
  const p=curP();if(!p||!rollResult)return;
  const {d,note,passMsg}=rollResult;rollResult=null;
  const cell=BOARD[p.pos];
  movePieceAni(cur,p.pos);
  renderPlayers();refreshCells();
  if(p.cash<=0){p.cash=0;}
  setTimeout(()=>{
    openModal(modalHead("掷骰子","i-dice")+
      `<div class="mdesc center" style="font-size:20px;font-weight:800">${d} 点</div>
      <div class="mdesc"><b>${p.name}</b> 前进 ${d} 格，来到 <b>${cell.name}</b><br>${note}${passMsg}</div>
      <div class="mfoot"><button class="btn sm" onclick="closeModal();afterMove()">继续</button></div>`);
  },450);
}
function movePieceAni(i,pos){
  const el=$("#piece-"+i);if(!el)return;
  const c=CELL_POS[pos];
  const u=100/12;
  el.style.left=(c.c*u+u/2)+"%";
  el.style.top=(c.r*u+u/2)+"%";
  el.classList.remove("hop");void el.offsetWidth;el.classList.add("hop");
}
let landDepth=0;
function afterMove(){landDepth=0;landOn(BOARD[curP().pos]);}
function endTurn(){
  const p=curP();
  if(p&&p.dbl>0){
    const who=p.name;p.dbl=0;rolling=false;
    openModal(modalHead("双数连掷！","i-dice")+
      `<div class="mdesc">${who} 掷出了<b>双数</b>，白嫖一次再掷机会！</div>
      <div class="eff-line">再掷一次（耗体力）或直接结束回合</div>
      <div class="mfoot">
        <button class="btn" onclick="doRoll()">再掷一次</button>
        <button class="btn ghost sm" onclick="closeModal();endTurnNow()">结束回合</button>
      </div>`);
    return;
  }
  endTurnNow();
}
function endTurnNow(){
  const p=curP();
  if(p.cash<=0&&p.alive){p.alive=false;sfxBad();toast(p.name+" 生活费耗尽，破产出局");}
  const alive=P.filter(x=>x.alive);
  if(alive.length<=1&&P.length>1){settlement();return;}
  cur=(cur+1)%P.length;

const GRP_NAME={life:"生活区",domi:"宿舍区",sport:"运动区",serv:"服务区",relax:"休闲区"};
const EXP_NAME={dining:"去吃饭",rest:"休息一下",feast:"出去吃顿好的",sport:"锻炼/买水",shop:"去购物",courier:"取快递",print:"打印资料",lake:"湖边转转",view:"去观景"};
const EXP_FN={dining:"onDining",rest:"onRest",feast:"onFeast",sport:"onSport",shop:"onShop",courier:"onCourier",print:"onPrint",lake:"onLake",view:"viewFn"};
function ownerOf(id){for(let i=0;i<P.length;i++){if(P[i].props&&P[i].props[id])return i;}return -1;}
function rentOf(cell,lv){
  const l=lv||1;
  let r=Math.ceil(cell.price*0.15/5)*5*l;
  if(groupMonopoly(cell.grp))r*=2;
  return r;
}
function upCost(cell,lv){return lv>=3?0:Math.round(cell.price*(lv===1?0.7:1.4));}
function groupMonopoly(grp){
  const ids=BOARD.filter(c=>c.grp===grp).map(c=>c.id);
  const cnt={};
  for(let i=0;i<P.length;i++){for(const id in (P[i].props||{})){if(ids.indexOf(+id)>=0)cnt[i]=(cnt[i]||0)+1;}}
  for(const i in cnt){if(cnt[i]>=3)return true;}
  return false;
}
function onProp(cell){
  const p=curP();
  const own=ownerOf(cell.id);
  if(own>=0&&own!==cur){rentEvent(cell,own);return;}
  const lv=p.props[cell.id]||0;
  const mono=groupMonopoly(cell.grp);
  const expBtn=cell.exp?`<button class="btn ok sm" onclick="${EXP_FN[cell.exp]}(BOARD[${cell.id}])">${EXP_NAME[cell.exp]}</button>`:"";
  const action=own===-1?
    `<button class="btn" ${p.cash>=cell.price?"":"disabled"} onclick="buyProp(${cell.id})">购置（-${cell.price}）</button>
    <button class="btn ok sm" onclick="auctionStart(${cell.id})">捡漏拍卖</button>`:
    `<button class="btn" ${p.cash>=upCost(cell,lv)?"":"disabled"} onclick="upgradeProp(${cell.id})">升级设施（-${upCost(cell,lv)}）</button>`;
  openModal(modalHead(cell.name+" · 校园地产","i-dorm")+
    `<div class="mdesc">【${GRP_NAME[cell.grp]}】标价 <b>${cell.price}</b> · 基础租金 <b>${Math.ceil(cell.price*0.15/5)*5}</b>${mono?" · <b style='color:var(--good)'>已形成片区 ×2</b>":""}</div>
    <div class="eff-line">${lv>0?`当前等级 ${lv} · 租金 ${rentOf(cell,lv)}`:"尚未拥有，可购置为校园地产"}</div>
    <div class="mfoot">
      ${action}
      ${expBtn}
      <button class="btn ghost sm" onclick="closeModal();endTurn()">离开</button>
    </div>`);
}
function buyProp(id){
  const p=curP();const cell=BOARD[id];
  if(p.cash<cell.price){toast("生活费不足");return;}
  p.cash-=cell.price;p.props=p.props||{};p.props[id]=1;sfxWin();
  openModal(modalHead("购置成功","i-dorm")+
    `<div class="eff-line good">你买下了 <b>${cell.name}</b>（${GRP_NAME[cell.grp]}）！</div>
    <div class="mdesc">别人踩到这里要交 <b>${rentOf(cell,1)}</b> 生活费。${groupMonopoly(cell.grp)?"<br>同区已集齐 3 处，租金 ×2！":""}</div>
    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
}
function upgradeProp(id){
  const p=curP();const cell=BOARD[id];
  const lv=p.props[id]||0;
  if(lv>=3){toast("已满级");return;}
  const cost=upCost(cell,lv);

    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
}
function rentEvent(cell,own){
  const p=curP();const o=P[own];
  const lv=o.props[cell.id];
  let amt=rentOf(cell,lv);
  let soldMsg="";
  if(p.cash<amt){
    const sold=autoSell(p,amt-p.cash);
    soldMsg=sold.length?`<div class="mdesc small">生活费不足，变卖了 ${sold.join("、")}。</div>`:`<div class="mdesc small">生活费不足且无地产可卖。</div>`;
    amt=Math.min(amt,p.cash);
  }
  p.cash=clamp(p.cash-amt,0,999999);o.cash+=amt;
  let dead="";
  if(p.cash<=0&&p.alive){
    if(!p.bailout){
      p.bailout=1;p.cash=300;p.gpa=clamp(p.gpa-0.2,0,RULES.gpaMax);
      dead="<div class='eff-line bad'>生活费耗尽！向银行借了高利贷复活：+300 生活费，绩点 -0.2（下次破产将出局）</div>";

  openModal(modalHead(cell.name+" · 过路费","i-dorm")+
    `<div class="mdesc"><b>${o.name}</b> 拥有 ${cell.name}（${lv} 级），你需支付 <b>${amt}</b> 生活费。</div>
    ${soldMsg}

/* ---- 捡漏拍卖（起拍价 6 折，AI 陪拍） ---- */
let __auc=null;
function auctionStart(id){
  const cell=BOARD[id];
  __auc={id:id, price:Math.round(cell.price*0.6), aiIn:false, aiPrice:0, step:0, over:false};
  auctionRender();
}
function auctionRender(){
  const a=__auc;if(!a)return;
  const cell=BOARD[a.id];const p=curP();
  const line=a.aiIn?
    `神秘买家出价 <b>${a.aiPrice}</b>，压过你了！要不要再抬一手？`:
    `当前出价 <b>${a.price}</b>（起拍 ${Math.round(cell.price*0.6)}）`;
  openModal(modalHead(cell.name+" · 捡漏拍卖","i-gym")+
    `<div class="mdesc">起拍价 <b>${Math.round(cell.price*0.6)}</b>（6 折），神秘买家随时可能出手！</div>
    <div class="eff-line ${a.aiIn?"bad":"good"}">${line}</div>
    <div class="mfoot">
      ${a.aiIn
        ?`<button class="btn" ${p.cash>=a.price+25?"":"disabled"} onclick="auctionBid()">再加价 +25</button>
          <button class="btn ghost sm" onclick="auctionPass()">放弃</button>`
        :`<button class="btn" ${p.cash>=a.price+15?"":"disabled"} onclick="auctionBid()">出价 +15</button>
          <button class="btn ghost sm" onclick="auctionPass()">放弃竞拍</button>`}
    </div>`);
}
function auctionBid(){
  const a=__auc;if(!a||a.over)return;
  const cell=BOARD[a.id];
  a.price+=a.aiIn?25:15;a.step++;
  if(!a.aiIn&&a.step<2&&Math.random()<0.55){
    a.aiIn=true;a.aiPrice=a.price+rnd(5,20);
    auctionRender();
    return;
  }
  auctionWin(true);
}
function auctionPass(){
  const a=__auc;if(!a||a.over)return;
  if(a.aiIn){auctionLose();}
  else{auctionWin(false);}
}
function auctionWin(take){
  const a=__auc;__auc=null;if(!a)return;
  const p=curP();const cell=BOARD[a.id];
  if(take){
    if(p.cash<a.price){
      openModal(modalHead("拍卖流拍","i-dorm")+
        `<div class="mdesc">你出价 ${a.price} 但生活费不足，${cell.name} 暂时无人接手。</div>
        <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
      return;
    }
    p.cash=clamp(p.cash-a.price,0,999999);
    p.props=p.props||{};p.props[a.id]=1;sfxWin();
    openModal(modalHead("拍卖成交！","i-dorm")+
      `<div class="eff-line good">以 ${a.price} 捡漏拿下 <b>${cell.name}</b>！</div>
      <div class="mdesc">别人踩到这里要交 <b>${rentOf(cell,1)}</b> 生活费。</div>
      <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
  }else{
    openModal(modalHead("放弃竞拍","i-dorm")+
      `<div class="mdesc">你放弃了 <b>${cell.name}</b> 的竞拍，土地回归银行。</div>
      <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
  }
}
function auctionLose(){
  const a=__auc;__auc=null;if(!a)return;
  openModal(modalHead("竞拍失败","i-dorm")+
    `<div class="mdesc">神秘买家以 <b>${a.aiPrice}</b> 拍走了 <b>${BOARD[a.id].name}</b>，下次出手要快！</div>
    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
}

function autoSell(p,need){
  const sold=[];
  const ids=Object.keys(p.props||{}).sort((a,b)=>BOARD[a].price-BOARD[b].price);
  let got=0;
  for(const id of ids){
    if(got>=need)break;
    const cell=BOARD[id];
    p.cash+=Math.round(cell.price*0.6);got+=Math.round(cell.price*0.6);
    delete p.props[id];sold.push(cell.name);
  }
  return sold;
}

function spin(){
  const disc=$("#wheel-disc");if(!disc||disc.dataset.busy)return;
  const btn=$("#btn-spin");if(btn)btn.disabled=true;
  disc.dataset.busy="1";
  const idx=rnd(0,3);
  const angle=360*5+(360-(idx*90+45));
  disc.style.transform="rotate("+angle+"deg)";
  sfxRoll();
  setTimeout(()=>{
    const res=WHEEL_RES[idx];
    const p=curP();
    p.gpa=clamp(p.gpa+res,0,RULES.gpaMax);
    const r=$("#wheel-result");
    if(r){
      r.textContent=(res>0?"+":"")+res+" 绩点";
      r.className="wheel-result "+(res>0?"good":res<0?"bad":"flat");
    }
    if(res>0)sfxWin();else if(res<0)sfxBad();
    disc.dataset.busy="";
    const go=document.createElement("button");
    go.className="btn sm";
    go.onclick=()=>{closeModal();endTurn();};
    go.textContent="确定";
    const foot=$("#wheel-box-foot");
    if(foot){foot.innerHTML="";foot.appendChild(go);}
  },2450);
}

function answer(idx){
  if(window.__qDone)return;window.__qDone=true;
  const p=curP();const q=window.__q;
  const correct=idx===q.a;
  const btns=$$(".opt");
  if(correct){if(btns[idx])btns[idx].classList.add("correct");p.failStreak=0;p.gpa=clamp(p.gpa+RULES.quizWin,0,RULES.gpaMax);sfxWin();}
  else{
    if(btns[idx])btns[idx].classList.add("wrong");
    const rightBtn=btns[q.a];if(rightBtn)rightBtn.classList.add("correct");
    p.gpa=clamp(p.gpa+RULES.quizLose,0,RULES.gpaMax);p.failStreak++;
    sfxBad();
    if(p.failStreak>=RULES.failStreakNeed){
      if(p.items.goggles>0){p.items.goggles--;toast("防护镜生效，免疫了「自信心受挫」！");}
      else{p.debuff="confidence";toast("连续答错 2 次：自信心受挫（下次骰子点数减半）");}
      p.failStreak=0;
    }
  }
  const card=$("#modal-root .modal");
  const box=document.createElement("div");
  box.className="eff-line "+(correct?"good":"bad");
  box.innerHTML=`${correct?"回答正确":"回答错误"}：${q.hint}<br>绩点 ${correct?"+0.05":"-0.03"} → ${p.gpa.toFixed(2)}`;
  card.appendChild(box);
  const go=document.createElement("div");go.className="mfoot";
  go.innerHTML=`<button class="btn sm" onclick="closeModal();window.__qDone=false;renderAll();endTurn()">继续</button>`;
  card.appendChild(go);
}

/* 知识闯关：5 题连答，答错即止 */
let __gaunt=null;
function quizGauntlet(subj){
  __gaunt={qs:shuffle(QSETS[subj]).slice(0,5),i:0,score:0,lock:false};
  gauntRender();
}
function gauntRender(){
  const d=__gaunt;if(!d)return;
  if(d.i>=d.qs.length){gauntEnd();return;}
  const q=d.qs[d.i];
  openModal(modalHead("知识闯关 · 第 "+(d.i+1)+" / 5 题","i-quiz")+
    `<div class="qcard">${q.q}</div>
    <div class="opts">
      ${q.opts.map((o,i)=>`<button class="opt" onclick="gauntPick(${i})"><span class="key">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}
    </div>
    <div class="eff-line center">已连对 ${d.score} 题</div>`);
}
function gauntPick(i){
  const d=__gaunt;if(!d||d.lock)return;d.lock=true;
  const correct=i===d.qs[d.i].a;
  const m=$("#modal-root .modal");
  if(correct){
    d.score++;sfxWin();
    m.innerHTML=modalHead("闯关成功","i-quiz")+
      `<div class="eff-line good">答对！已连对 ${d.score} 题</div>
      <div class="mfoot"><button class="btn sm" onclick="gauntNext()">下一题</button></div>`;
  }else{
    sfxBad();
    m.innerHTML=modalHead("闯关失败","i-quiz")+
      `<div class="eff-line bad">答错，闯关结束（连对 ${d.score} 题）</div>
      <div class="mfoot"><button class="btn sm" onclick="gauntEnd()">结算</button></div>`;
  }
}
function gauntNext(){
  const d=__gaunt;if(!d)return;
  d.i++;d.lock=false;gauntRender();
}
function gauntEnd(){
  const d=__gaunt;__gaunt=null;
  if(d)gauntletSettle(d.score);
}
function gauntletSettle(score){
  if(NET.mode==="client"){NET.send({t:"act",act:"gauntletSettle",p:NET.myIdx,i:score});return;}
  const p=curP();
  let g=0;
  if(score>=5)g=0.1;else if(score>=4)g=0.07;else if(score>=3)g=0.04;else if(score>=2)g=0.02;else if(score>=1)g=0.01;else g=-0.02;
  p.gpa=clamp(p.gpa+g,0,RULES.gpaMax);
  const xpGain={5:25,4:18,3:10,2:6,1:4,0:1}[score]||2;
  p.xp=(p.xp||0)+xpGain;
  const lv=xpLevel(p.xp);
  const cls=g>0?"good":g<0?"bad":"flat";
  openModal(modalHead("闯关结算","i-quiz")+
    `<div class="eff-line ${cls}">连对 ${score} 题：${g>0?"+":"-"}${Math.abs(g).toFixed(2)} 绩点 → ${p.gpa.toFixed(2)}</div>
    <div class="xp-line">学识 <b>+${xpGain}</b> XP · ${lv.lvl}</div>
    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">继续</button></div>`);
  if(g>0)sfxWin();else if(g<0)sfxBad();
}

function examAnswer(idx){
  if(window.__qDone)return;window.__qDone=true;
  const p=curP();const q=window.__q;
  const correct=idx===q.a;
  const btns=$$(".opt");
  if(correct){if(btns[idx])btns[idx].classList.add("correct");p.failStreak=0;p.gpa=clamp(p.gpa+RULES.examWin,0,RULES.gpaMax);sfxWin();}
  else{
    if(btns[idx])btns[idx].classList.add("wrong");
    const rb=btns[q.a];if(rb)rb.classList.add("correct");
    p.gpa=clamp(p.gpa+RULES.examLose,0,RULES.gpaMax);p.failStreak++;sfxBad();
    if(p.failStreak>=RULES.failStreakNeed){
      if(p.items.goggles>0){p.items.goggles--;toast("防护镜生效，免疫了「自信心受挫」！");}
      else{p.debuff="confidence";toast("连续答错 2 次：自信心受挫（下次骰子点数减半）");}
      p.failStreak=0;
    }
  }
  const card=$("#modal-root .modal");
  const box=document.createElement("div");
  box.className="eff-line "+(correct?"good":"bad");
  box.innerHTML=`${correct?"考试通过":"考试失利"}：${q.hint}<br>绩点 ${correct?"+0.1":"-0.05"} → ${p.gpa.toFixed(2)}`;
  card.appendChild(box);
  const go=document.createElement("div");go.className="mfoot";
  go.innerHTML=`<button class="btn sm" onclick="closeModal();window.__qDone=false;renderAll();endTurn()">继续</button>`;
  card.appendChild(go);

/* ================= 结算 ================= */
function totalScore(p){
  if(!p.alive)return 0;
  return p.cash+p.gpa*RULES.scoreGpa+p.mood*RULES.scoreMood+p.energy*RULES.scoreEnergy;
}
function settlement(){
  const ranked=P.slice().sort((a,b)=>totalScore(b)-totalScore(a));
  const winner=ranked.find(x=>x.alive);
  let medal="";
  if(winner)medal=winner.name+" 夺得校园传奇称号！";
  const list=ranked.map((p,i)=>{
    const sc=totalScore(p);
    return `<div class="rank-item ${i===0?"win":""}">
      <div class="rno">${i+1}</div>
      <div class="rname"><span class="chip" style="background:${p.color}"></span>${p.name}${!p.alive?'<span class="tag">已出局</span>':""}</div>
      <div class="rassets">${p.cash} 生活费<br>GPA ${p.gpa.toFixed(2)} · 心情 ${p.mood}% · 体力 ${p.energy}</div>
      <div class="rval"><b>${sc.toLocaleString()}</b>总分</div>
    </div>`;
  }).join("");
  openModal(modalHead("游戏结束 · 结算","i-crown")+
    `<div class="mdesc" style="text-align:center;font-weight:800;color:var(--accent)">${medal}</div>
    <div class="rank-list">${list}</div>
    <div class="eff-line">总评分 = 生活费 + GPA×${RULES.scoreGpa} + 心情×${RULES.scoreMood} + 体力×${RULES.scoreEnergy}</div>
    <div class="mfoot"><button class="btn" onclick="closeModal();backSetup()">再来一局</button></div>`);
}

/* ================= 联机层（PeerJS P2P，房主权威） ================= */
const NET={mode:"local",isHost:false,myIdx:0,name:"",roomCode:"",peer:null,conns:[],conn:null,players:[],started:false,shimmed:false,relay:null};
NET.relaySend=function(m){if(this.relay&&this.relay.readyState===1){try{this.relay.send(JSON.stringify({t:"data",room:this.roomCode,data:m}));return true;}catch(e){}}return false;};
NET.send=function(m){if(this.relaySend(m))return;if(this.conn&&this.conn.open){try{this.conn.send(m);}catch(e){}}};
NET.broadcast=function(m){if(this.relaySend(m))return;const self=this;this.conns.forEach(c=>{try{if(c.open)c.send(m);}catch(e){}});};
NET.reset=function(){if(this.peer){try{this.peer.destroy();}catch(e){}}if(this.relay){try{this.relay.close();}catch(e){}}this.peer=null;this.relay=null;this.conns=[];this.conn=null;this.mode="local";this.isHost=false;this.myIdx=0;this.roomCode="";this.name="";this.players=[];this.started=false;};
function setMode(m){
  ["local","host","join"].forEach(x=>{
    const mb=document.querySelector(`#mode-row .mode-btn[data-mode="${x}"]`);
    if(mb)mb.classList.toggle("on",x===m);
    const p=$("#panel-"+x);if(p)p.classList.toggle("show",x===m);
  });
}
function makeRoomCode(){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s;}
function updateNetBadge(){
  const b=$("#net-badge");if(!b)return;
  if(NET.mode==="local"){b.style.display="none";return;}
  b.style.display="inline-flex";
  $("#net-badge-txt").textContent=NET.mode==="host"?("房主 · 房间 "+NET.roomCode):("玩家"+(NET.myIdx+1)+" · 房间 "+NET.roomCode);
}
function renderHostLobby(){
  if(NET.mode!=="host")return;
  const rc=$("#room-code");if(rc)rc.textContent=NET.roomCode;
  const hc=$("#host-count");if(hc)hc.textContent=NET.players.length;
  const hp=$("#host-players");if(hp)hp.innerHTML=NET.players.map((q,i)=>`<div class="net-player ${i===0?"me":""}"><span class="chip" style="background:${q.color}"></span>${q.name}${i===0?"（房主）":""}</div>`).join("");
  const hs=$("#host-status");if(hs)hs.textContent=NET.players.length+" 人已就绪";
}
function createRoom(){
  if(!window.Peer){toast("网络库加载失败，请刷新页面重试");return;}
  const name=($("#net-name-h").value||"").trim().slice(0,6)||"房主";
  NET.mode="host";NET.isHost=true;NET.name=name;
  NET.players=[{name:name,color:PCOLORS[0]}];
  NET.roomCode=makeRoomCode();
  try{NET.peer=new Peer("bdu-"+NET.roomCode.toLowerCase(),{host:"0.peerjs.com",secure:true});}
  catch(e){toast("无法连接网络服务，请检查网络");NET.reset();return;}
  installNetShims();
  NET.peer.on("open",()=>{

/* ================= 中继联机（跨网络 WebSocket 服务器，无需 PeerJS/公网 P2P） ================= */
/* ---- 中继地址自动更新/自动发现（谁都不用手动填地址） ---- */
let __relayManual={h:false,j:false};
function bindRelayInputWatch(){
  [["h","#relay-url-h"],["j","#relay-url-j"]].forEach(kv=>{
    const el=document.querySelector(kv[1]); if(!el)return;
    el.addEventListener("input",()=>{__relayManual[kv[0]]=true;});
  });
}
function autoRelayUrl(){
  // 本机中继服务器开着时，自动把最新公网地址填入输入框（用户未手动改才生效）
  [["h","#relay-url-h"],["j","#relay-url-j"]].forEach(kv=>{
    const el=document.querySelector(kv[1]); if(!el)return;
    try{
      fetch("http://127.0.0.1:8899/api/relay/url",{mode:"cors"})
        .then(r=>r.ok?r.json():null)
        .then(d=>{ if(d&&d.url&&!__relayManual[kv[0]]){ el.value=d.url; } })
        .catch(()=>{});
    }catch(e){}
  });
}
function relayBroadcastStart(roomCode,url){
  // 房主建房后通过公共信令广播自己的中继地址；朋友输房间码即可自动获取
  try{
    if(typeof Peer==="undefined")return;
    const peer=new Peer("bdu"+roomCode,{debug:0});
    NET.relayPeer=peer;
    peer.on("connection",conn=>{
      conn.on("data",()=>{ try{conn.send({t:"relay-url",url:url});}catch(e){} });
      conn.on("error",()=>{});
    });
    peer.on("error",()=>{});
  }catch(e){}
}
function relayAutoDiscover(roomCode){
  // 朋友端：输入房间码后自动从房主广播获取最新中继地址
  return new Promise(res=>{
    const timer=setTimeout(()=>{ try{peer&&peer.destroy();}catch(e){} res(""); },8000);
    let peer=null;
    if(typeof Peer==="undefined"){clearTimeout(timer);res("");return;}
    try{ peer=new Peer("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),{debug:0}); }catch(e){clearTimeout(timer);res("");return;}
    peer.on("error",()=>{clearTimeout(timer);try{peer.destroy();}catch(e){} res("");});
    peer.on("open",()=>{
      const conn=peer.connect("bdu"+roomCode,{reliable:true});
      conn.on("open",()=>{ try{conn.send({t:"need-url"});}catch(e){} });
      conn.on("data",d=>{ if(d&&d.t==="relay-url"&&d.url){ clearTimeout(timer); res(d.url); try{conn.close();peer.destroy();}catch(e){} } });
      conn.on("error",()=>{});
      conn.on("close",()=>{clearTimeout(timer);try{peer.destroy();}catch(e){} res("");});
    });
  });
}

function relayConnect(role){
  const urlInp=role==="host"?document.querySelector("#relay-url-h"):document.querySelector("#relay-url-j");
  const name=((role==="host"?document.querySelector("#net-name-h"):document.querySelector("#net-name-j")).value||"").trim().slice(0,6)||(role==="host"?"房主":"同学");
  const js=document.querySelector("#join-status");
  let room="";
  if(role==="host"){
    room=makeRoomCode();NET.mode="host";NET.isHost=true;NET.name=name;NET.players=[{name:name,color:PCOLORS[0]}];NET.roomCode=room;
    const url=(urlInp&&urlInp.value.trim())||"ws://127.0.0.1:8899";
    relayBroadcastStart(room,url);           // 广播中继地址，朋友输入房间码即可自动获取
    if(js)js.textContent="正在连接中继服务器 "+url+" …";
    relaySocketOpen(url,role,room,name,js);
  }else{
    room=(document.querySelector("#net-room").value||"").trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(room)){toast("房间码应为 6 位字母数字");return;}
    NET.mode="client";NET.name=name;NET.roomCode=room;
    if(js)js.textContent="正在自动获取房主的中继地址…";
    relayAutoDiscover(room).then(found=>{
      const url=found||(urlInp&&urlInp.value.trim())||"ws://127.0.0.1:8899";
      if(found&&urlInp)urlInp.value=found;   // 自动更新为中继地址
      if(js)js.textContent="正在连接中继服务器 "+url+" …";
      relaySocketOpen(url,role,room,name,js);
    });
  }
}
function relaySocketOpen(url,role,room,name,js){
  let ws;
  try{ws=new WebSocket(url);}catch(e){toast("服务器地址格式应为 ws://IP:端口");return;}
  NET.relay=ws;
  ws.onopen=()=>{try{ws.send(JSON.stringify({t:"join",role:role,room:room,name:name}));}catch(e){}};
  ws.onmessage=(ev)=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}relayDispatch(m);};
  ws.onclose=()=>{toast("与中继服务器断开连接");NET.reset();setMode("local");};
  ws.onerror=()=>{if(js)js.textContent="";toast("连不上中继服务器：默认公网地址可能已更换，请把地址改成房主提供的最新 wss 地址");NET.reset();setMode("local");};
}
function relayDispatch(m){
  if(m.t==="welcome"){
    NET.myIdx=m.idx;NET.roomCode=m.roomCode;
    NET.players=(m.players||[]).map((q,i)=>({name:q.name,color:PCOLORS[i%4]}));
    if(NET.players.length<=NET.myIdx)NET.players.push({name:NET.name,color:PCOLORS[NET.myIdx%4]});
    if(NET.isHost){
      installNetShims();
      const hr=document.querySelector("#host-room");if(hr)hr.style.display="block";
      renderHostLobby();updateNetBadge();
      toast("房间创建成功！把房间码分享给同学（跨网络需同一中继服务器）");
    }else{
      updateNetBadge();
      toast("已加入房间 "+m.roomCode);
    }
    const js=document.querySelector("#join-status");if(js)js.textContent="";
    return;
  }
  if(m.t==="join"){
    if(NET.isHost){
      NET.players.push({name:m.player.name,color:PCOLORS[(m.idx||NET.players.length)%4]});
      renderHostLobby();
      toast(m.player.name+" 加入房间");
    }
    return;
  }
  if(m.t==="left"){
    if(NET.isHost){
      NET.players=NET.players.filter((q,i)=>i!==m.idx);
      renderHostLobby();
      toast(m.name+" 离开房间");
    }
    return;
  }
  if(m.t==="err"){toast(m.msg);const js=document.querySelector("#join-status");if(js)js.textContent="";NET.reset();setMode("local");return;}
  if(m.t==="data"){
    if(NET.isHost){
      onHostData({open:true,send:(mm)=>{NET.relaySend(mm);}},m.data);
    }else if(m.from===0){
      onClientData(m.data);
    }
  }
}

function onHostData(conn,d){
  if(!d||typeof d!=="object")return;
  if(d.t==="join"){
    if(NET.players.length>=4){try{conn.send({t:"full"});}catch(e){}return;}
    const name=(d.name||"").slice(0,6)||("玩家"+(NET.players.length+1));
    const idx=NET.players.length;
    NET.players.push({name:name,color:PCOLORS[idx%4]});
    NET.conns.push(conn);
    try{conn.send({t:"welcome",idx:idx,name:name,players:NET.players,roomCode:NET.roomCode});}catch(e){}
    NET.broadcast({t:"lobby",players:NET.players});
    renderHostLobby();
    return;
  }
  if(d.t==="game"){
    if(!NET.started)return;
    teamHostMsg(d);
    return;
  }
  if(d.t==="miniStart"){
    if(!NET.started)return;
    if(d.p!==cur)return;
    openModal(modalHead("迷你游戏","i-star")+`<div class="mdesc">${curP().name} 正在挑战 <b>${miniTitle(d.g)}</b>…<br>稍后公布结果</div>`);
    NET.broadcast({t:"miniShow",who:cur,whoName:curP().name,g:d.g});
    return;
  }
  if(d.t==="act"){
    if(!NET.started)return;
    if(d.p!==cur)return;
    runAct(d.act,d);
  }
}
function onClientData(d){
  if(!d||typeof d!=="object")return;
  if(d.t==="full"){toast("房间已满");return;}
  if(d.t==="welcome"){NET.myIdx=d.idx;NET.players=d.players;updateNetBadge();toast("已加入房间 "+d.roomCode);}
  if(d.t==="lobby"){NET.players=d.players;}
  if(d.t==="start"){NET.started=true;showView("view-game");renderAll();}
  if(d.t==="roll"){rollUI(d.d1,d.d2,d.d,d.note,d.passMsg);}
  if(d.t==="game"){
    teamClientMsg(d);
    return;
  }
  if(d.t==="miniShow"){if(NET.myIdx!==d.who)openModal(modalHead("迷你游戏","i-star")+`<div class="mdesc">${d.whoName} 正在挑战 <b>${miniTitle(d.g)}</b>…<br>稍后公布结果</div>`);}

let __puz=null;
function playPuzzle(){
  if(NET.mode==="client"&&NET.myIdx!==cur){toast("等待轮到你");return;}
  miniNotifyStart("puzzle");
  let arr=[1,2,3,4,5,0],hole=5,g=0;
  do{
    arr=[1,2,3,4,5,0];hole=5;
    for(let t=0;t<70;t++){
      const nbs=[];
      [-1,1].forEach(o=>{const h=hole+o;if(h>=0&&h<6&&Math.floor(h/3)===Math.floor(hole/3))nbs.push(h);});
      [-3,3].forEach(o=>{const h=hole+o;if(h>=0&&h<6)nbs.push(h);});
      const h=nbs[Math.floor(Math.random()*nbs.length)];
      arr[hole]=arr[h];arr[h]=0;hole=h;
    }
    g++;
  }while(arr.every((v,i)=>v===i+1||v===0)&&g<10);
  __puz={arr:arr,hole:hole,steps:0,sec:0,done:false,timer:null};
  openModal(modalHead("拼图大师","i-star")+
    `<div class="mdesc center">把数字 1-5 滑动归位！剩余 <b id="puz-t">60</b> 秒</div>

    <div class="eff-line center">步数 0</div>`);

    if(!__puz||__puz.done)return;
    __puz.sec++;
    const left=60-__puz.sec;const t=$("#puz-t");if(t)t.textContent=Math.max(left,0);
    if(left<=0){clearInterval(__puz.timer);puzDone(false);}
  },1000);

  const d=__puz;if(!d)return;
  const grid=$("#puz-grid");if(!grid)return;

}
function puzMove(i){
  const d=__puz;if(!d||d.done)return;

    if(g==="teamquiz"){__team.qs=shuffle(QSETS.prof).slice(0,5);}
    if(g==="teamjanken"){P.forEach(x=>{if(x.alive)x.cash=clamp(x.cash-20,0,999999);});}
    if(g==="teamvote"){__team.qs=VOTE_QS.slice();}
    if(g==="teamtype"){__team.phrases=shuffle(TYPE_PHRASES).slice(0,3);}
    if(g==="teamreact"){__team.greenTs=0;}
    if(g==="teamauction"){__team.value=rnd(60,150);}
    if(g==="teammath"){__team.qi=0;__team.qs=Array.from({length:5},()=>{const a=rnd(2,40),b=rnd(1,30);return {q:(Math.random()<0.5?a+" + "+b:a+" - "+b),a:Math.abs(a-b)};});}
    if(g==="teamballoon"){__team.boom={};aliveIdx().forEach(i=>{__team.boom[i]=rnd(3000,7000);});}
    teamLocalRender();
    return;
  }
  if(NET.mode!=="host"){NET.send({t:"act",act:"teamStart",p:NET.myIdx,i:g});return;}
  window.__team={g:g,phase:"play",qi:0,answers:{},rolls:{},hands:{},scores:{},round:0,timer:null,result:[],out:{},inAlive:window.__teamProto.inAlive,aimRes:{},draws:{},holds:{},typeAns:{},picked:{},myPick:[],showCells:[],choices:{},doneT:{},totalT:{},sorted:[],next:0,memoAns:{},curNum:"",mathAns:{},bids:{},spinRes:{},drawRes:{},value:0};
  const whoName=curP().name;
  if(g==="teamquiz"){__team.qs=shuffle(QSETS.prof).slice(0,5);NET.broadcast({t:"game",g:"teamquiz",st:"start",qs:__team.qs,who:cur,whoName:whoName});teamHostQuizUI();}
  else if(g==="teamdice"){NET.broadcast({t:"game",g:"teamdice",st:"start",who:cur,whoName:whoName});teamHostDiceUI();}
  else if(g==="teamjanken"){P.forEach(x=>{if(x.alive)x.cash=clamp(x.cash-20,0,999999);});NET.broadcast({t:"game",g:"teamjanken",st:"start",who:cur,whoName:whoName});teamHostJankenUI();}
  else if(g==="teamslow"){NET.broadcast({t:"game",g:"teamslow",st:"start",who:cur,whoName:whoName});teamHostSlowUI();}
  else if(g==="teamreact"){NET.broadcast({t:"game",g:"teamreact",st:"start",who:cur,whoName:whoName});setTimeout(()=>{NET.broadcast({t:"game",g:"teamreact",st:"green",ts:Date.now()});teamHostReactGreen();},rnd(2000,5000));}
  else if(g==="teamtap"){NET.broadcast({t:"game",g:"teamtap",st:"start",who:cur,whoName:whoName});teamHostTapUI();}
  else if(g==="teamvote"){__team.qs=VOTE_QS.slice();NET.broadcast({t:"game",g:"teamvote",st:"start",qs:VOTE_QS,who:cur,whoName:whoName});teamHostVoteUI();}
  else if(g==="teamwar"){__team.round=0;NET.broadcast({t:"game",g:"teamwar",st:"start",who:cur,whoName:whoName});teamHostWarUI();}
  else if(g==="teamballoon"){NET.broadcast({t:"game",g:"teamballoon",st:"start",who:cur,whoName:whoName});teamHostBalloonUI();}
  else if(g==="teamtype"){__team.phrases=shuffle(TYPE_PHRASES).slice(0,3);NET.broadcast({t:"game",g:"teamtype",st:"start",ps:__team.phrases,who:cur,whoName:whoName});teamHostTypeUI();}
  else if(g==="teamgrid"){__team.round=0;NET.broadcast({t:"game",g:"teamgrid",st:"start",who:cur,whoName:whoName});teamHostGridUI();}
  else if(g==="teamorder"){NET.broadcast({t:"game",g:"teamorder",st:"start",who:cur,whoName:whoName});teamHostOrderUI();}
  else if(g==="teamsort"){__team.round=0;NET.broadcast({t:"game",g:"teamsort",st:"start",who:cur,whoName:whoName});teamHostSortUI();}
  else if(g==="teamcoin"){__team.round=0;__team.out={};NET.broadcast({t:"game",g:"teamcoin",st:"start",who:cur,whoName:whoName});teamHostCoinUI();}
  else if(g==="teamauction"){__team.value=rnd(60,150);NET.broadcast({t:"game",g:"teamauction",st:"start",value:__team.value,who:cur,whoName:whoName});teamHostAuctionUI();}
  else if(g==="teammath"){__team.qi=0;__team.qs=Array.from({length:5},()=>{const a=rnd(2,40),b=rnd(1,30);return {q:(Math.random()<0.5?a+" + "+b:a+" - "+b),a:Math.abs(a-b)};});NET.broadcast({t:"game",g:"teammath",st:"start",qs:__team.qs,who:cur,whoName:whoName});teamHostMathUI();}
  else if(g==="teammemo"){__team.round=0;NET.broadcast({t:"game",g:"teammemo",st:"start",who:cur,whoName:whoName});teamHostMemoUI();}
  else if(g==="teamaim"){NET.broadcast({t:"game",g:"teamaim",st:"start",who:cur,whoName:whoName});teamHostAimUI();}
  else if(g==="teamspin"){NET.broadcast({t:"game",g:"teamspin",st:"start",who:cur,whoName:whoName});teamHostSpinUI();}
  else if(g==="teamdrawl"){NET.broadcast({t:"game",g:"teamdrawl",st:"start",who:cur,whoName:whoName});teamHostDrawlUI();}
}

/* ---------- teamquiz ---------- */
function teamHostQuizUI(){
  const t=__team;if(!t)return;
  t.phase="q";
  const q=t.qs[t.qi];
  openModal(modalHead("全员竞答 · 第 "+(t.qi+1)+" / "+t.qs.length+" 题","i-star")+
    `<div class="mdesc">${q.q}</div>
    <div class="opts">
      ${q.opts.map((o,i)=>`<button class="opt" onclick="teamHostAns(${i})"><span class="key">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}
    </div>
    <div class="eff-line center" id="tq-cnt">已答 ${Object.keys(t.answers).length} / ${aliveIdx().length}</div>`);
  clearTimeout(t.timer);
  t.timer=setTimeout(teamQuizReveal,8000);
}
function teamHostAns(i){
  const t=__team;if(!t||t.g!=="teamquiz"||t.phase!=="q")return;
  if(t.answers[cur]!==undefined)return;
  t.answers[cur]=i;sfxClick();
  const c=$("#tq-cnt");if(c)c.textContent="已答 "+Object.keys(t.answers).length+" / "+aliveIdx().length;
  teamQuizCheckAll();
}
function teamQuizCheckAll(){
  const t=__team;if(!t)return;
  if(Object.keys(t.answers).length>=aliveIdx().length)teamQuizReveal();
}
function teamQuizReveal(){
  const t=__team;if(!t)return;
  clearTimeout(t.timer);
  const q=t.qs[t.qi];
  const correct=[];
  P.forEach((x,i)=>{if(x.alive&&t.answers[i]===q.a)correct.push(i);});
  t.scores[correct.length]=null; // no-op keep object
  correct.forEach(i=>{t.scores[i]=(t.scores[i]||0)+1;});
  t.result.push({q:t.qi,ans:q.a,correct:correct});
  t.qi++;t.answers={};
  const msg={t:"game",g:"teamquiz",st:"reveal",last:t.qi-1,correct:correct,next:t.qi,total:t.qs.length};
  NET.broadcast(msg);
  teamQuizShowReveal(msg);
  if(t.qi<t.qs.length){
    t.timer=setTimeout(teamQuizReveal,8000);
  }
}
function teamQuizShowReveal(msg){
  const t=__team;if(!t)return;
  const names=msg.correct.map(i=>P[i].name).join("、")||"无人答对";
  if(msg.next<msg.total){
    const q=t.qs[msg.next];
    openModal(modalHead("全员竞答 · 第 "+(msg.next+1)+" / "+msg.total+" 题","i-star")+
      `<div class="eff-line ${msg.correct.length?"good":"flat"}">上一题答对：${names}</div>
      <div class="mdesc">${q.q}</div>
      <div class="opts">
        ${q.opts.map((o,i)=>`<button class="opt" onclick="teamClientAns(${i})"><span class="key">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}
      </div>
      <div class="eff-line center">作答后等待揭晓…</div>`);
  }else{
    teamQuizEnd(msg);
  }
}
function teamClientAns(i){
  if(NET.mode==="client")NET.send({t:"game",g:"teamquiz",st:"ans",p:NET.myIdx,i:i});
  else teamHostAns(i);
  const m=$("#modal-root .modal");
  m.innerHTML=modalHead("已作答","i-star")+`<div class="eff-line">你的选择已提交，等待全员揭晓…</div>`;
}
function teamQuizEnd(msg){
  const t=__team;if(!t)return;
  const ranked=aliveIdx().sort((a,b)=>(t.scores[b]||0)-(t.scores[a]||0));
  const s1=ranked[0],s2=ranked[1];
  // 应用奖励（host 权威；local 也执行）
  if(P[s1]){P[s1].cash=clamp(P[s1].cash+30,0,999999);P[s1].gpa=clamp(P[s1].gpa+0.03,0,RULES.gpaMax);}
  if(P[s2]&&s2!==s1)P[s2].cash=clamp(P[s2].cash+15,0,999999);
  P.forEach((x,i)=>{if(x.alive)x.mood=clamp(x.mood+3,0,100);});
  P[cur].cash=clamp(P[cur].cash+10,0,999999);
  sfxWin();
  const line=ranked.map((i,k)=>`<div class="row">${k+1}${k===0?"🥇":k===1?"🥈":""} · <b>${P[i].name}</b> · 答对 ${t.scores[i]||0} 题${k===0?" · +30 生活费 +0.03 绩点":k===1?" · +15 生活费":""}</div>`).join("");
  openModal(modalHead("全员竞答 · 结果","i-star")+
    `<div class="mdesc">排名（全员 +3 心情，发起者 +10 生活费）：</div>
    ${line}
    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">返回游戏</button></div>`);
  NET.broadcast({t:"game",g:"teamquiz",st:"end",rank:ranked.map(i=>P[i].name),scores:t.scores});
  renderPlayers();
  window.__team=null;
}

function teamHostDiceUI(){

    <div class="dice-big-box"><div class="dice dice-big" id="td-dice"></div></div>

    <div class="eff-line center" id="td-cnt">已掷 ${Object.keys(t.rolls).length} / ${aliveIdx().length}</div>`);
  clearTimeout(t.timer);
  t.timer=setTimeout(teamDiceReveal,10000);

function teamHostRoll(){
  const t=__team;if(!t||t.g!=="teamdice"||t.phase!=="d")return;
  if(t.rolls[cur]!==undefined)return;
  const v=rnd(1,6);
  let k=0;
  const iv=setInterval(()=>{setDice(rnd(1,6),0);if(++k>=8){clearInterval(iv);
    setDice(v,0);
    t.rolls[cur]=v;sfxClick();
    const c=$("#td-cnt");if(c)c.textContent="已掷 "+Object.keys(t.rolls).length+" / "+aliveIdx().length;
    teamDiceCheckAll();
  }},90);
}
function teamDiceCheckAll(){
  const t=__team;if(!t)return;
  if(Object.keys(t.rolls).length>=aliveIdx().length)teamDiceReveal();
}
function teamDiceReveal(){
  const t=__team;if(!t)return;
  clearTimeout(t.timer);
  const rolls={};
  P.forEach((x,i)=>{if(x.alive&&t.rolls[i]!==undefined)rolls[i]=t.rolls[i];});
  const maxv=Math.max(...Object.values(rolls));
  const winners=Object.keys(rolls).filter(i=>rolls[i]===maxv).map(Number);
  if(winners.length>1&&t.round<3){
    t.round++;t.rolls={};t.phase="d";
    const msg={t:"game",g:"teamdice",st:"redo",rolls:rolls,round:t.round};
    NET.broadcast(msg);
    if(NET.mode==="local"){t.localTurn=0;teamLocalRender();return;}
    teamHostDiceUI();
    return;
  }
  const winner=winners[0];
  if(P[winner])P[winner].cash=clamp(P[winner].cash+50,0,999999);
  P.forEach((x,i)=>{if(x.alive)x.mood=clamp(x.mood+3,0,100);});
  P[cur].cash=clamp(P[cur].cash+10,0,999999);
  sfxWin();
  openModal(modalHead("全员骰战 · 结果","i-dice")+
    `<div class="mdesc">点数一览：</div>
    ${Object.keys(rolls).map(i=>`<div class="row"><b>${P[i].name}</b> · 掷出 ${rolls[i]}</div>`).join("")}
    <div class="eff-line good"><b>${P[winner].name}</b> 点数最高，+50 生活费！（全员 +3 心情，发起者 +10）</div>
    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">返回游戏</button></div>`);
  NET.broadcast({t:"game",g:"teamdice",st:"end",rolls:rolls,winner:P[winner].name});
  renderPlayers();
  window.__team=null;
}

      <button class="jhand" onclick="teamHostJanken(1)"><b>✕</b>剪刀</button>
      <button class="jhand" onclick="teamHostJanken(2)"><b>□</b>布</button>
    </div>
    <div class="eff-line center" id="tj-cnt">已出 ${Object.keys(t.hands).length} / ${aliveIdx().length}</div>`);
  clearTimeout(t.timer);
  t.timer=setTimeout(teamJankenResolve,8000);

function teamHostJanken(h){
  const t=__team;if(!t||t.g!=="teamjanken"||t.phase!=="j")return;
  if(t.hands[cur]!==undefined)return;
  t.hands[cur]=h;sfxClick();
  const c=$("#tj-cnt");if(c)c.textContent="已出 "+Object.keys(t.hands).length+" / "+aliveIdx().length;
  teamJankenCheckAll();
}
function teamJankenCheckAll(){
  const t=__team;if(!t)return;
  if(Object.keys(t.hands).length>=aliveIdx().length)teamJankenResolve();
}
function jankenJudge(cnt){
  const nonZero=cnt.filter(x=>x>0).length;
  if(nonZero===1||nonZero===3)return -1;
  if(cnt[0]>0&&cnt[1]>0)return 0;
  if(cnt[1]>0&&cnt[2]>0)return 1;
  return 2;
}
function teamJankenResolve(){
  const t=__team;if(!t)return;
  clearTimeout(t.timer);
  const cnt=[0,0,0];
  P.forEach((x,i)=>{if(x.alive&&t.hands[i]!==undefined)cnt[t.hands[i]]++;});
  const winType=jankenJudge(cnt);
  if(winType<0&&t.round<3){
    t.round++;t.hands={};t.phase="j";
    NET.broadcast({t:"game",g:"teamjanken",st:"redo",round:t.round});
    if(NET.mode==="local"){t.localTurn=0;teamLocalRender();return;}
    teamHostJankenUI();
    return;
  }
  const winners=winType<0?[]:Object.keys(t.hands).filter(i=>t.hands[i]===winType).map(Number);
  const pot=aliveIdx().length*20;
  const names=["石头","剪刀","布"];
  let line="";
  if(winners.length>0){
    const w=winners[0];
    P[w].cash=clamp(P[w].cash+pot,0,999999);
    line=`<div class="eff-line good"><b>${P[w].name}</b> 出 ${names[winType]} 通吃全场，+${pot} 生活费！</div>`;
  }else{
    line=`<div class="eff-line flat">三轮平局，投注退回（每人 -20 已退回 +20）。</div>`;
    P.forEach((x,i)=>{if(x.alive)x.cash=clamp(x.cash+20,0,999999);});
  }
  P.forEach((x,i)=>{if(x.alive)x.mood=clamp(x.mood+3,0,100);});
  P[cur].cash=clamp(P[cur].cash+10,0,999999);
  sfxWin();
  openModal(modalHead("全员猜拳 · 结果","i-gym")+
    `<div class="mdesc">${aliveIdx().map(i=>`<div class="row"><b>${P[i].name}</b> · 出 ${names[t.hands[i]]||"-"}</div>`).join("")}</div>
    ${line}
    <div class="mdesc small">全员 +3 心情，发起者 +10 生活费</div>
    <div class="mfoot"><button class="btn sm" onclick="closeModal();renderAll();endTurn()">返回游戏</button></div>`);
  NET.broadcast({t:"game",g:"teamjanken",st:"end",hands:t.hands,winner:winners.length?P[winners[0]].name:""});
  renderPlayers();
  window.__team=null;
}

let ONLINE_Q=[]; // 服务器在线题库（quiz-data.json，启动时自动拉取，失败用内置题兜底）
let __extNext=0;
function htmlDecode(str){return String(str).replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#039;/g,"'").replace(/&#39;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&aacute;/g,"á").replace(/&eacute;/g,"é").replace(/&iacute;/g,"í").replace(/&oacute;/g,"ó").replace(/&uacute;/g,"ú").replace(/&ntilde;/g,"ñ").replace(/&ouml;/g,"ö").replace(/&uuml;/g,"ü");}
function fetchQuiz(){
  const n=30;
  const cands=[];
  try{
    if(location.protocol==="http:"||location.protocol==="https:")cands.push(location.origin+"/api/quiz?subj=ALL&n="+n);
    const u=(document.querySelector("#relay-url-h")||{}).value||(document.querySelector("#relay-url-j")||{}).value||"";
    const m=String(u||"").trim().replace(/^wss:\/\//,"https://").replace(/^ws:\/\//,"http://").replace(/\/+$/,"");
    if(m)cands.push(m+"/api/quiz?subj=ALL&n="+n);
  }catch(e){}
  cands.push("http://127.0.0.1:8899/api/quiz?subj=ALL&n="+n);
  let done=false;
  cands.forEach(url=>{
    try{
      fetch(url,{mode:"cors"}).then(r=>{if(!r.ok)throw new Error("http "+r.status);return r.json();}).then(d=>{
        if(done||!d||!Array.isArray(d.quiz)||!d.quiz.length)return;
        done=true;
        ONLINE_Q=d.quiz.map(x=>({q:x.q,opts:x.opts,a:typeof x.a==="number"?x.a:0,hint:x.hint||"在线题库"}));
        console.log("[在线题库] 已接入 "+ONLINE_Q.length+" 题（"+url+"）");
      }).catch(()=>{});
    }catch(e){}
  });
}
function fetchExternal(){
  if(Date.now()<__extNext)return;
  __extNext=Date.now()+60000;
  try{
    fetch("https://opentdb.com/api.php?amount=30&type=multiple")
      .then(r=>r.json())
      .then(d=>{
        if(!d||!d.results)return;
        EXTERN_Q=d.results.filter(x=>x.question&&x.correct_answer).map(x=>{
          const opts=shuffle([x.correct_answer,...(x.incorrect_answers||[])]).map(htmlDecode);
          const ans=htmlDecode(x.correct_answer);
          return {q:htmlDecode(x.question),opts:opts,a:opts.indexOf(ans),ans:ans,hint:"正确答案："+ans};
        });
        if(EXTERN_Q.length>0)console.log("[知识库] 已接入外部题库 "+EXTERN_Q.length+" 题");
      }).catch(()=>{__extNext=Date.now()+60000;});
  }catch(e){}
}

const IDIOM_SET=new Set(IDIOM_LIB);
const IDIOM_HEAD=new Set(IDIOM_LIB.map(x=>x[0]));
let __idiom=null;
function playIdiomchain(){
  if(NET.mode==="client"&&NET.myIdx!==cur){toast("等待轮到你");return;}
  miniNotifyStart("idiomchain");
  const _starts=IDIOM_LIB.filter(x=>{const t=x.slice(-1);return IDIOM_LIB.some(y=>y!==x&&y[0]===t);});const start=_starts.length?_starts[rnd(0,_starts.length-1)]:IDIOM_LIB[rnd(0,IDIOM_LIB.length-1)];
  __idiom={cur:start,score:0,sec:0,over:false,timer:null,used:[start],t0:Date.now()};
  idiomRender();
  __idiom.timer=setInterval(()=>{
    const d=__idiom;if(!d||d.over){clearInterval(d.timer);return;}
    d.sec=Math.floor((Date.now()-d.t0)/1000);
    const left=60-d.sec;
    const t=$("#idi-t");if(t)t.textContent=Math.max(left,0);
    if(left<=0){d.over=true;clearInterval(d.timer);idiomDone();}
  },500);
}
function idiomRender(){
  const d=__idiom;if(!d)return;
  const tail=d.cur.slice(-1);
  openModal(modalHead("成语接龙 · 限时 60 秒","i-star")+
    `<div class="mdesc center">上家：<b>${d.cur}</b><br>请接一个以“<b>${tail}</b>”开头的四字成语</div>
    <input id="idi-in" type="text" maxlength="8" placeholder="输入成语，回车确认" style="width:100%;padding:10px 6px;font-size:20px;text-align:center;border-radius:10px;border:2px solid var(--line);margin:8px 0;min-height:44px">
    <div class="eff-line center">已接 <b>${d.score}</b> 个 · 剩余 <b id="idi-t">60</b> 秒</div>`);
  const inp=$("#idi-in");
  inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();idiomCheck();}};
  inp.focus();
}
function idiomCheck(){
  const d=__idiom;if(!d||d.over)return;
  const raw=($("#idi-in").value||"").trim();
  const v=raw.replace(/[\s，。、！？·,.!?（）()]/g,"");
  if(v.length!==4){toast("请输入四字成语");return;}
  const tail=d.cur.slice(-1);
  if(v[0]!==tail){toast("要以“"+tail+"”开头哦");sfxBad();return;}
  if(d.used.includes(v)){toast("这个成语已经用过了");return;}
  d.used.push(v);d.cur=v;d.score++;sfxWin();
  if(!IDIOM_SET.has(v))toast("“"+v+"”是词库外成语，已算接上");
  const t=$("#idi-t");if(t)t.textContent=Math.max(60-d.sec,0);
  idiomRender();
}
function idiomDone(){
  const d=__idiom;__idiom=null;
  miniSettle({g:"idiomchain",data:{score:d.score}});
}

function pairFlip(i){
  const d=__pair;if(!d||d.lock)return;
  const btns=document.querySelectorAll(".pair-card");
  if(btns[i].classList.contains("open")||btns[i].classList.contains("match"))return;
  d.open.push(i);
  btns[i].textContent=d.deck[i];btns[i].classList.add("open");
  if(d.open.length===2){
    d.lock=true;
    const [a,b]=d.open;
    if(d.deck[a]===d.deck[b]){
      d.done++;d.open=[];d.lock=false;
      btns[a].classList.add("match");btns[b].classList.add("match");
      const el=document.querySelector(".eff-line b");if(el)el.textContent=d.done;
      if(d.done===8){const sec=Math.round((Date.now()-d.t0)/1000);setTimeout(()=>miniSettle({g:"matchpair",data:{done:true,sec}}),400);}
    }else{
      setTimeout(()=>{btns[a].textContent="?";btns[a].classList.remove("open");btns[b].textContent="?";btns[b].classList.remove("open");d.open=[];d.lock=false;},850);
    }
  }
}

function snakeKey(e){const k=e.key;if(k==="ArrowUp")snakeMove(-1,0);else if(k==="ArrowDown")snakeMove(1,0);else if(k==="ArrowLeft")snakeMove(0,-1);else if(k==="ArrowRight")snakeMove(0,1);}
function snakeMove(dy,dx){
  const d=__snake;if(!d||d.over)return;
  if((d.dir.y===1&&dy===-1)||(d.dir.y===-1&&dy===1)||(d.dir.x===1&&dx===-1)||(d.dir.x===-1&&dx===1))return;
  d.dir={y:dy,x:dx};
}
function snakeTick(){
  const d=__snake;if(!d||d.over)return;
  const h=[d.seg[0][0]+d.dir.y,d.seg[0][1]+d.dir.x];
  if(h[0]<0||h[0]>=d.grid||h[1]<0||h[1]>=d.grid||d.seg.some(s=>s[0]===h[0]&&s[1]===h[1])){snakeOver(false);return;}
  d.seg.unshift(h);
  const ate=h[0]===d.food[0]&&h[1]===d.food[1];
  if(ate){d.food=[rand(d.grid),rand(d.grid)];if(d.seg.length-1>=8){snakeOver(true);return;}}
  else d.seg.pop();
  snakeDraw();
}
function snakeDraw(){
  const d=__snake,cv=document.getElementById("snake-cv");if(!cv)return;
  const ctx=cv.getContext("2d"),cs=20;
  ctx.fillStyle="#0e1b2e";ctx.fillRect(0,0,400,400);
  d.seg.forEach((s,i)=>{ctx.fillStyle=i===0?"#37e08a":"#1f9d55";ctx.fillRect(s[1]*cs,s[0]*cs,cs-1,cs-1);});
  ctx.fillStyle="#e8485a";ctx.beginPath();ctx.arc(d.food[1]*cs+cs/2,d.food[0]*cs+cs/2,cs/2-2,0,7);ctx.fill();
}
function snakeOver(win){
  const d=__snake;if(!d||d.over)return;d.over=true;

}

function brickKey(e){if(e.key==="ArrowLeft")brickMove(-1);else if(e.key==="ArrowRight")brickMove(1);}
function brickMove(dir){const d=__brick;if(!d||d.over)return;d.px=clamp(d.px+dir*d.pv,0,d.W-d.pw);}
function brickTick(){
  const d=__brick;if(!d||d.over)return;

  if(d.bx<0||d.bx>d.W-8)d.bvx*=-1;

  if(d.by>d.H-8){brickOver(false);return;}
  if(d.by>=d.H-30&&d.by<=d.H-22&&d.bx>=d.px-8&&d.bx<=d.px+d.pw+8&&d.bvy>0)d.bvy*=-1;
  d.bricks.forEach(b=>{if(b.alive&&d.bx>=b.x-4&&d.bx<=b.x+b.w+4&&d.by>=b.y-4&&d.by<=b.y+b.h+4){b.alive=false;d.left--;d.bvy*=-1;if(d.left===0)brickOver(true);}});
  brickDraw();
}
function brickDraw(){
  const d=__brick,cv=document.getElementById("brick-cv");if(!cv)return;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#0e1b2e";ctx.fillRect(0,0,d.W,d.H);
  d.bricks.forEach(b=>{if(b.alive){ctx.fillStyle="#3b82f6";ctx.fillRect(b.x,b.y,b.w,b.h);}});
  ctx.fillStyle="#e5e7eb";ctx.fillRect(d.px,d.H-22,d.pw,6);
  ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(d.bx,d.by,7,0,7);ctx.fill();
}
