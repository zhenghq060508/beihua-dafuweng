function m2048Key(e){const k=e.key;if(k==="ArrowLeft")m2048Move('l');else if(k==="ArrowRight")m2048Move('r');else if(k==="ArrowUp")m2048Move('u');else if(k==="ArrowDown")m2048Move('d');}
function m2048Move(dir){
  const d=__m2048;if(!d||d.won)return;
  const g=d.g;
  let moved=false;
  const slide=ln=>{const arr=ln.filter(v=>v!==0);for(let i=arr.length-1;i>0;i--){if(arr[i]===arr[i-1]){arr[i]*=2;arr.splice(i-1,1);i--;}}while(arr.length<4)arr.unshift(0);return arr;};
  for(let i=0;i<4;i++){
    if(dir==='l'){const orig=g[i].join(',');const line=slide([...g[i]]);g[i].splice(0,4,...line);if(g[i].join(',')!==orig)moved=true;}
    else if(dir==='r'){const orig=g[i].join(',');const line=slide([...g[i]].reverse()).reverse();g[i].splice(0,4,...line);if(g[i].join(',')!==orig)moved=true;}

  }

  const z=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)z.push([y,x]);}));
  if(z.length){const p=z[rand(z.length)];g[p[0]][p[1]]=Math.random()<0.9?2:4;}
  m2048Render();
}

    stack.push([r+dr,c+dc]);

    `<div class="mdesc center">你和 AI 轮流下棋，先连成一线者胜！</div>
    <div class="ttt-grid">${d.board.map((v,i)=>`<button class="ttt-btn" onclick="stttPlay(${i})" ${v?"disabled":""}>${v||""}</button>`).join("")}</div>
    <div class="eff-line center">胜 ${d.wins} 局</div>`);
}
function stttWinLine(b){
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return lines.find(l=>b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]);
}
function stttPlay(i){
  const d=__sttt;if(!d||d.board[i]||!d.mine)return;
  d.board[i]="X";d.mine=false;
  if(stttWinLine(d.board)){stttEnd("你");return;}
  if(d.board.every(x=>x)){stttEnd("平");return;}
  const empty=d.board.map((v,j)=>v?null:j).filter(x=>x!==null);
  const ai=empty[rnd(0,empty.length-1)];
  d.board[ai]="O";d.mine=true;
  if(stttWinLine(d.board)){stttEnd("AI");return;}
  if(d.board.every(x=>x)){stttEnd("平");return;}
  stttRender();
}
function stttEnd(who){
  const d=__sttt;if(!d)return;
  if(who==="你"){d.wins++;sfxWin();}else if(who==="AI"){sfxBad();}else{sfxClick();}
  const m=$("#modal-root .modal");
  m.innerHTML=modalHead("井字棋 · 结果","i-star")+
    `<div class="eff-line ${who==="你"?"good":who==="AI"?"bad":""}">${who==="平"?"平局":who+" 胜"}</div>
    <div class="eff-line center">胜 ${d.wins} / ${d.round}</div>
    <div class="mfoot"><button class="btn sm" onclick="stttNext()">下一局</button></div>`;
}
function stttNext(){
  const d=__sttt;if(!d)return;
  d.round++;
  if(d.round>3){const w=d.wins;__sttt=null;miniSettle({g:"sttt",data:{wins:w}});return;}
  d.board=[null,null,null,null,null,null,null,null,null];d.mine=true;
  stttRender();
}

let __bal=null;
function playBalance(){
  if(NET.mode==="client"&&NET.myIdx!==cur){toast("等待轮到你");return;}
  miniNotifyStart("balance");
  __bal={score:0,tries:0,phase:"p",pos:0,timer:null};
  balRender();
}
function balRender(){
  const d=__bal;if(!d)return;
  openModal(modalHead("按压力度 · 第 "+(d.tries+1)+" / 3 次","i-star")+
    `<div class="mdesc center">按住让进度条上升，在<b>绿色区（70-90）</b>松手！越接近 80 越好</div>
    <div class="press-bar"><div class="press-zone"></div><div class="press-fill" id="bl-fill" style="width:0%"></div></div>
    <div class="mfoot"><button class="btn ok big" id="bl-btn" onpointerdown="balDown()" onpointerup="balUp()">按住充力</button></div>
    <div class="eff-line center" id="bl-st">当前 0</div>`);
}
function balDown(){
  const d=__bal;if(!d||d.phase!=="p")return;
  clearInterval(d.timer);
  d.timer=setInterval(()=>{
    if(!__bal)return;
    d.pos=Math.min(100,d.pos+8);
    const f=$("#bl-fill");if(f)f.style.width=d.pos+"%";
    const st=$("#bl-st");if(st)st.textContent="当前 "+d.pos;
  },100);
}
function balUp(){
  const d=__bal;if(!d||d.phase!=="p")return;
  clearInterval(d.timer);
  d.phase="r";
  const v=d.pos,dev=Math.abs(v-80);
  const pts=Math.max(0,100-dev*2);
  d.score+=pts;d.tries++;
  const m=$("#modal-root .modal");
  m.innerHTML=modalHead("按压力度 · 结果","i-star")+
    `<div class="eff-line ${pts>=80?"good":pts>=50?"":"bad"}">力度 ${v}，稳定度 ${pts} 分！</div>
    <div class="eff-line center">总稳定度 ${d.score}</div>
    <div class="mfoot"><button class="btn sm" onclick="balNext()">下一次</button></div>`;
}
function balNext(){
  const d=__bal;if(!d)return;
  if(d.tries>=3){const avg=Math.round(d.score/3);__bal=null;miniSettle({g:"balance",data:{avg:avg}});return;}
  d.pos=0;d.phase="p";
  balRender();
}

let __count=null;
function playCount(){
  if(NET.mode==="client"&&NET.myIdx!==cur){toast("等待轮到你");return;}
  miniNotifyStart("count");
  __count={score:0,i:0,num:0};
  countShow();
}
function countShow(){
  const d=__count;if(!d)return;
  if(d.i>=10){countEnd();return;}
  d.num=rnd(1,9);
  openModal(modalHead("视觉计数 · 第 "+(d.i+1)+" / 10 题","i-star")+
    `<div class="mdesc center">记住屏幕上出现的点数！</div>
    <div class="cnt-dots" id="cd-dots"></div>`);
  const dots=$("#cd-dots");
  if(dots)dots.innerHTML=Array.from({length:d.num},()=>`<div class="cnt-dot"></div>`).join("");
  setTimeout(()=>{
    if(!__count)return;
    const dots=$("#cd-dots");
    if(dots)dots.innerHTML="";
    const m=$("#modal-root .modal");
    if(m)m.innerHTML=modalHead("视觉计数","i-star")+
      `<div class="mdesc center">刚才有几个点？</div>
      <div class="janken-hands">
        ${[1,2,3,4,5].map(v=>`<button class="cnt-opt" onclick="countAnswer(${v})">${v}</button>`).join("")}
      </div>
      <div class="janken-hands">
        ${[6,7,8,9].map(v=>`<button class="cnt-opt" onclick="countAnswer(${v})">${v}</button>`).join("")}
      </div>
      <div class="eff-line center">答对 ${d.score} / ${d.i}</div>`;
  },500);
}
function countAnswer(v){
  const d=__count;if(!d)return;
  if(v===d.num){d.score++;sfxWin();}else{sfxBad();}
  d.i++;
  countShow();
}
function countEnd(){
  const d=__count;__count=null;
  miniSettle({g:"count",data:{score:d.score}});
}

function playFortune(){
  if(NET.mode==="client"&&NET.myIdx!==cur){toast("等待轮到你");return;}
  miniNotifyStart("fortune");
  openModal(modalHead("今日运势","i-star")+
    `<div class="mdesc center">抽一支今日运势签，看看今天的运气！</div>
    <div class="box-big" onclick="fortuneDraw()">抽 签<br><span style="font-size:12px">点击抽取</span></div>`);
}
function fortuneDraw(){
  const r=Math.random();
  const lvl=r<0.1?"上上":r<0.4?"上":r<0.75?"中":"下";
  const p=curP();
  let line="";
  if(lvl==="上上"){p.gpa=clamp(p.gpa+0.05,0,RULES.gpaMax);line="上上签！+0.05 绩点";sfxWin();}
  else if(lvl==="上"){p.cash=clamp(p.cash+15,0,999999);line="上签！+15 生活费";sfxWin();}
  else if(lvl==="中"){p.mood=clamp(p.mood+5,0,100);line="中签！+5 心情";sfxClick();}
  else{p.cash=clamp(p.cash-5,0,999999);line="下签……-5 生活费";sfxBad();}
  miniSettle({g:"fortune",data:{lvl:lvl}});
}

function installNetShims(){
  if(NET.shimmed)return;NET.shimmed=true;
  const acts=["afterMove","endTurn","studySkip","moodRest","restTurn","useHammer","useHammerExam","doLab","feedAnimal","watchAnimal","doStudy","doWorship","doCraft","joinActivity","doExercise","buyWater","drinkTea","lakeZoned","lakePhoto","doClimb","doPhoto","doPrint","spin","chanceDraw","ringThrow","doSelfStudy","auctionBid","auctionPass","flipClass","betExam"];
  acts.forEach(n=>{
    const fn=window[n];
    window[n]=function(){if(NET.mode==="client"){NET.send({t:"act",act:n,p:NET.myIdx});return;}
      const r=fn.apply(this,arguments);if(NET.mode==="host")bcastSync();return r;};
  });
  ["answer","examAnswer","eatAt","buyProp","upgradeProp","portalGo","cableCar","miniSettle","auctionStart","useItemTo","teamStart","studyBuddy","gauntletSettle","memoSettle"].forEach(n=>{
    const fn=window[n];
    window[n]=function(){if(NET.mode==="client"){const m={t:"act",act:n,p:NET.myIdx};if(arguments.length>0)m.i=arguments[0];NET.send(m);return;}
      const r=fn.apply(this,arguments);if(NET.mode==="host")bcastSync();return r;};
  });
  const doRollFn=window.doRoll;
  window.doRoll=function(){if(NET.mode==="client"){NET.send({t:"act",act:"doRoll",p:NET.myIdx});return;}
    return doRollFn.apply(this,arguments);};
  const confirmFn=window.confirmMove;
  window.confirmMove=function(){if(NET.mode==="client"){NET.send({t:"act",act:"confirmMove",p:NET.myIdx});return;}
    const r=confirmFn.apply(this,arguments);if(NET.mode==="host")setTimeout(bcastSync,700);return r;};
}
